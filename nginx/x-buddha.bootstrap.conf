# Install temporarily before the first Certbot run.
server {
    listen 80;
    listen [::]:80;
    server_name xbuddha.org www.xbuddha.org admin.xbuddha.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
