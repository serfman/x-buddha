# Install temporarily before the first Certbot run.
server {
    listen 80;
    listen [::]:80;
    server_name x-buddha.ru www.x-buddha.ru admin.x-buddha.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
